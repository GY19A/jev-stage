<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

const BASE=".", el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let META={}, S=null, busy=false, idleT=null, idleI=0, cache={}, lastIdle='';

const SEEDS=["Hello there!","You look amazing today.","I lost my keys again…",
             "Let's dance!","Can you explain quantum tunnelling?","That's hilarious.",
             "I have to go now.","Wait, what just happened?"];

window.__stage = {step:'start', err:null};

/* ---------- TypeSafe (Jev) direct client ---------- */
const TS_URL = "https://api.typesafe.ai/v1/systemone";
const KEY_ITEM = "jev-stage.typesafe.key";
const getKey = () => localStorage.getItem(KEY_ITEM) || "";
const setKey = k => k ? localStorage.setItem(KEY_ITEM, k) : localStorage.removeItem(KEY_ITEM);

function buildQuestions(){
  const crit = {};
  for (const e of STAGE_META.emotions){
    const m = STAGE_META.byEmotion[e];
    crit[e] = m && m.when ? m.when : e;
  }
  return {
    emotion: {type:"choice",
      instructions:"Which single performance class best fits this message?",
      criteria: crit},
    energy: {type:"choice",
      instructions:"How energetic should the performance be?",
      criteria:{gentle:"soft, subdued, low-key",
                moderate:"normal, conversational",
                high:"big, physical, high energy"}}
  };
}

async function askJev(text, model){
  const key = getKey();
  if(!key){ openKeyDialog(); throw new Error("no api key"); }
  const t0 = performance.now();
  const res = await fetch(TS_URL, {
    method:"POST",
    headers:{"content-type":"application/json","authorization":"Bearer "+key},
    body: JSON.stringify({model: model||"jev-latest", state: text,
                          questions: buildQuestions()})
  });
  const ms = performance.now() - t0;
  if(res.status===401 || res.status===403){
    openKeyDialog("That key was rejected. Check it and try again.");
    throw new Error("unauthorized");
  }
  if(!res.ok){
    let d=""; try{ d=(await res.json()).detail||""; }catch(e){}
    throw new Error(d || ("HTTP "+res.status));
  }
  const j = await res.json();
  const u = j.usage||{};
  const emo = j.answers && j.answers.emotion && j.answers.emotion.choice;
  const motion = (STAGE_META.byEmotion && STAGE_META.byEmotion[emo])
               || {id:'Relax', label:'Relax', loop:true};
  return {answers:j.answers, ms, motion,
          decisions:Object.keys(j.answers||{}).length,
          tokens:{prompt:u.input_tokens||0, completion:u.output_tokens||0}};
}

/* ---------- key dialog ---------- */
function openKeyDialog(msg){
  let d = document.getElementById('keyDlg');
  if(!d){
    d = document.createElement('div'); d.id='keyDlg'; d.className='keydlg';
    d.innerHTML = `<div class="kbox">
      <h3>TypeSafe API key</h3>
      <p class="kmsg" id="kMsg">This page calls the Jev API directly from your browser.
         Your key is stored in this browser's localStorage and is never sent anywhere else.</p>
      <p class="kmsg">GitHub Pages hosts only the 3D stage. TypeSafe currently blocks
         browser API requests via CORS; a key alone does not fix that. Use the motion
         preview without a key, or configure your own trusted proxy as described in the
         <a href="https://github.com/GY19A/jev-stage#the-cors-caveat--read-this-before-you-file-an-issue"
         target="_blank" rel="noopener">README</a>. No AI results are simulated.</p>
      <input id="kInp" type="password" placeholder="apikey_..." autocomplete="off" spellcheck="false">
      <div class="krow">
        <button id="kSave">Save &amp; continue</button>
        <button id="kClear" class="ghost">Forget key</button>
      </div>
      <p class="khint">Get a key at <a href="https://console.typesafe.ai/keys" target="_blank"
         rel="noopener">console.typesafe.ai/keys</a></p></div>`;
    document.body.appendChild(d);
    d.addEventListener('click', e=>{ if(e.target===d) d.classList.remove('on'); });
    d.querySelector('#kSave').onclick = ()=>{
      const v=d.querySelector('#kInp').value.trim();
      if(v){ setKey(v); d.classList.remove('on'); updateKeyBadge(); }
    };
    d.querySelector('#kClear').onclick = ()=>{
      setKey(""); d.querySelector('#kInp').value=""; updateKeyBadge();
    };
    d.querySelector('#kInp').addEventListener('keydown', e=>{
      if(e.key==='Enter') d.querySelector('#kSave').click();
    });
  }
  if(msg) d.querySelector('#kMsg').textContent = msg;
  d.querySelector('#kInp').value = getKey();
  d.classList.add('on');
  setTimeout(()=>d.querySelector('#kInp').focus(), 50);
}
function updateKeyBadge(){
  const b=document.getElementById('keyBadge'); if(!b) return;
  const k=getKey();
  b.textContent = k ? "key \u2713" : "set API key";
  b.className = "keybadge" + (k ? " ok" : "");
}

window.openKeyDialog=openKeyDialog; window.updateKeyBadge=updateKeyBadge;

    META.motions.map(m=>`<option value="${esc(m.id)}">${esc(m.label)}</option>`).join('');
  el('motionPreview').onchange = previewMotion;
  el('chips').innerHTML = SEEDS.map(s=>`<span class="chip">${esc(s)}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    el('inp').value=c.textContent; send(); });

  el('inp').onkeydown=e=>{ if(e.key==='Enter') send(); };
  el('avatar').onchange=()=>load(el('avatar').value);
  window.__stage.step='initGL';

function initGL(){
  const canvas=el('cv');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.12;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x05060a);
  scene.fog=new THREE.Fog(0x05060a, 4.5, 11);

  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity=0.48;

  const camera=new THREE.PerspectiveCamera(31, 1, 0.1, 60);

  // MToon (VRM) materials are already flat-shaded, so they blow out fast.
  // One modest key + a soft fill + a rim is enough; stacking lights bleaches
  // skin and light fabric while the blacks stay put.
  const key=new THREE.DirectionalLight(0xfff6ec, 1.55);
  key.position.set(2.0,3.0,3.4); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048); key.shadow.bias=-0.0006;
  key.shadow.camera.near=0.5; key.shadow.camera.far=14;
  key.shadow.camera.left=-3; key.shadow.camera.right=3;
  key.shadow.camera.top=4; key.shadow.camera.bottom=-1;
  scene.add(key);
  const fill=new THREE.DirectionalLight(0x9fc0ff, 0.42);
  fill.position.set(-3.0,1.7,2.6); scene.add(fill);
  const rim=new THREE.DirectionalLight(0x7cc4ff, 1.15);
  rim.position.set(-1.6,2.3,-3.4); scene.add(rim);
  scene.add(new THREE.AmbientLight(0x5a6478, 0.80));

  // floor: dark, slightly reflective, catches the shadow
  const floor=new THREE.Mesh(
    new THREE.CircleGeometry(7,64),
    new THREE.MeshStandardMaterial({color:0x090c12,roughness:.42,metalness:.65}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  const ring=new THREE.Mesh(
    new THREE.RingGeometry(1.35,1.42,96),
    new THREE.MeshBasicMaterial({color:0x2563eb,transparent:true,opacity:.30,
                                 side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=0.002; scene.add(ring);
  const grid=new THREE.GridHelper(16,32,0x1b3a63,0x0e1622);
  grid.material.transparent=true; grid.material.opacity=.32;
  grid.position.y=0.001; scene.add(grid);

  // Post-processing is skipped when the GPU is a software rasteriser
  // (headless CI, SwiftShader): the bloom pass renders black there.
  const soft = /swiftshader|llvmpipe|software/i.test((()=>{
    const gl=renderer.getContext();
    const d=gl.getExtension('WEBGL_debug_renderer_info');
    return d?String(gl.getParameter(d.UNMASKED_RENDERER_WEBGL)):'';
  })()) || new URLSearchParams(location.search).has('nopost');
  let composer=null;
  if(!soft){
    composer=new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene,camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(1,1), 0.18, 0.7, 0.95));
    composer.addPass(new OutputPass());
  }

  const clock=new THREE.Clock();
  S={renderer,scene,camera,composer,clock,ring,vrm:null,mixer:null,action:null,
     target:new THREE.Vector3(0,1,0), camGoal:new THREE.Vector3(0,1,3),
     resize(){
       const w=innerWidth,h=innerHeight;
       renderer.setSize(w,h,false); if(composer) composer.setSize(w,h);
       camera.aspect=w/h; camera.updateProjectionMatrix();
     }};
  updateKeyBadge();
  S.resize(); addEventListener('resize',()=>S&&S.resize());
  window.__S=S;

  let t=0; window.__frames=0;
  (function loop(){
    window.__frames++;
    requestAnimationFrame(loop);
    const dt=clock.getDelta(); t+=dt;
    if(S.mixer) S.mixer.update(dt);
    if(S.vrm) S.vrm.update(dt);
    // slow breathing camera drift — keeps the frame alive
    camera.position.x += ((S.camGoal.x + Math.sin(t*0.22)*0.13) - camera.position.x)*0.035;
    camera.position.y += ((S.camGoal.y + Math.sin(t*0.31)*0.045) - camera.position.y)*0.035;
    camera.position.z += (S.camGoal.z - camera.position.z)*0.035;
    camera.lookAt(S.target);
    S.ring.material.opacity = 0.22 + Math.sin(t*1.5)*0.09;
    if(composer) composer.render(); else renderer.render(scene,camera);
  })();
}

function loader(){
  const l=new GLTFLoader();
  l.register(p=>new VRMLoaderPlugin(p));
  l.register(p=>new VRMAnimationLoaderPlugin(p));
  return l;
}

let loading=false;
async function load(id){
  if(loading) return;
  loading=true;
  const sel=el('avatar'); if(sel) sel.disabled=true;
  try{ await load_(id); }
  catch(e){ const h=el('hConf'); if(h) h.textContent='avatar failed to load'; }
  finally{ loading=false; if(sel) sel.disabled=false; }
}

async function load_(id){
  const meta=META.avatars.find(a=>a.id===id)||META.avatars[0];
  clearTimeout(idleT); idleT=null;
  if(S.vrm){ S.scene.remove(S.vrm.scene); VRMUtils.deepDispose(S.vrm.scene); }
  S.mixer=null; S.action=null; cache={};
  const hud2=el('hConf');
  if(hud2) hud2.textContent='loading '+meta.label+' …';
  // Cloudflare strips content-length on compressed transfers, so ev.total is
  // often 0 — fall back to showing megabytes received.
  const gltf=await loader().loadAsync(BASE+'/static/vrm/'+meta.file, e=>{
    if(!hud2) return;
    hud2.textContent = e.total
      ? 'loading '+meta.label+' · '+Math.round(e.loaded/e.total*100)+'%'
      : 'loading '+meta.label+' · '+(e.loaded/1048576).toFixed(1)+' MB';
  });
  const vrm=gltf.userData.vrm;
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  VRMUtils.combineSkeletons(gltf.scene);
  vrm.scene.traverse(o=>{ o.frustumCulled=false;
    if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  if(vrm.lookAt) vrm.lookAt.target=S.camera;
  // VRM 0.x faces +Z, VRM 1.0 faces -Z: only the old spec needs flipping.
  const isV0 = !!(vrm.meta && (vrm.meta.metaVersion === '0' ||
                               vrm.meta.metaVersion === 0 ||
                               vrm.meta.exporterVersion === undefined &&
                               vrm.meta.title !== undefined && vrm.meta.name === undefined));
  vrm.scene.rotation.y = isV0 ? Math.PI : 0;
  S.scene.add(vrm.scene); S.vrm=vrm;
  S.mixer=new THREE.AnimationMixer(vrm.scene);
  frame(vrm);
  const hud3=el('hConf'); if(hud3) hud3.textContent='awaiting input';
  idleI=0; playIdle();
}

function frame(vrm){
  const box=new THREE.Box3().setFromObject(vrm.scene);
  const h=Math.max(0.5, box.getSize(new THREE.Vector3()).y);
  const fov=S.camera.fov*Math.PI/180;
  const dist=(h*1.08)/(2*Math.tan(fov/2));
  S.camGoal.set(0, box.min.y+h*0.66, dist);
  S.target.set(0, box.min.y+h*0.60, 0);
  S.camera.position.copy(S.camGoal);
}

async function clip(name){
  if(cache[name]) return cache[name];
  const g=await loader().loadAsync(BASE+'/static/vrma/'+name+'.vrma');
  const va=g.userData.vrmAnimations&&g.userData.vrmAnimations[0];
  if(!va) throw new Error('no animation');
  return (cache[name]=createVRMAnimationClip(va,S.vrm));
}

async function play(name, loop, isIdle){
  if(!S||!S.vrm) return null;
  let c; try{ c=await clip(name); }catch(e){ return null; }
  const a=S.mixer.clipAction(c);
  a.reset();
  a.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce, loop?Infinity:1);
  a.clampWhenFinished=!loop;
  if(S.action&&S.action!==a) a.crossFadeFrom(S.action, 0.55, false);
  a.play(); S.action=a;
  if(!isIdle){
    clearTimeout(idleT);
    const hold=loop?6500:Math.max(2000,c.duration*1000+600);
    idleT=setTimeout(()=>{ if(!busy) playIdle(); }, hold);
  }
  return c;
}

async function playIdle(){
  if(busy) return;
  const pool=(META.idle||[]).filter(n=>n!==lastIdle);
  const name=pool.length?pool[idleI%pool.length]:(META.idle||['motion_pose'])[0];
  idleI++; lastIdle=name;
  const c=await play(name,true,true);
  if(busy) return;
  clearTimeout(idleT);
  idleT=setTimeout(()=>{ if(!busy) playIdle(); },
                   Math.max(5000,(c?c.duration:4)*1600));
}

async function send(){
  const inp=el('inp'), text=(inp.value||'').trim();
  if(!text||busy) return;
  busy=true; clearTimeout(idleT); idleT=null;
  el('go').disabled=true;
  el('hConf').textContent='deciding…';
  try{
    const j=await askJev(text, el('model').value);
    const e=j.answers.emotion, en=j.answers.energy;
    el('hEmo').textContent=e.choice;
    el('hConf').innerHTML=`confidence <b>${(e.confidence*100).toFixed(0)}%</b> · `+
                          `energy <b>${esc(en?en.choice:'—')}</b>`;
    el('hLat').innerHTML=`<b>${j.ms.toFixed(0)}</b> ms · ${j.decisions} decisions · `+
                         `${(j.tokens&&j.tokens.prompt)||0} tok`;
    const s=el('say');
    s.innerHTML=`<b>you</b> ${esc(text)} &nbsp;·&nbsp; `+
                `<span style="color:#8b98ab">chose ${esc(e.choice)} → ${esc((j.motion&&j.motion.label)||'—')}</span>`;
    s.classList.add('on');
    await play(j.motion.id, !!j.motion.loop, false);
    inp.value='';
  }catch(err){ el('hConf').textContent=err.message; }
  busy=false; el('go').disabled=false;
  if(!idleT) idleT=setTimeout(()=>{ if(!busy) playIdle(); }, 6000);
}
async function previewMotion(){
  const picker=el('motionPreview');
  const motion=META.motions.find(m=>m.id===picker.value);
  if(!motion || busy || loading) return;
  busy=true; clearTimeout(idleT); idleT=null;
  picker.disabled=true; el('go').disabled=true; el('avatar').disabled=true;
  try{
    const c=await play(motion.id, !!motion.loop, false);
    el('hEmo').textContent='preview';
    el('hConf').textContent=c?'manual motion · no AI inference':'motion failed to load';
    el('hLat').textContent='';
    el('say').textContent='Motion preview: '+motion.label+' — selected by you, not a model.';
    el('say').classList.add('on');
  }finally{
    busy=false; picker.disabled=false; el('go').disabled=false; el('avatar').disabled=false;
    picker.value='';
    if(!idleT) idleT=setTimeout(playIdle, 6000);
  }
}
boot();
</script></body></html>
